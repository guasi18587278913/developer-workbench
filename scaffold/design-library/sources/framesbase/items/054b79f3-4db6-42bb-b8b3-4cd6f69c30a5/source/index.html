<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easylog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <span class="nav-logo">easylog</span>

  <div class="nav-pills">
    <button class="pill active">Main</button>
    <button class="pill">Platform</button>
    <button class="pill">Use</button>
    <button class="pill">Cases</button>
    <button class="pill">Integrations</button>
    <button class="pill">Journal</button>
    <button class="pill">Contact</button>
  </div>

  <button class="nav-menu-btn desktop-only">menu</button>

  <button id="hamburger" aria-label="Toggle menu" aria-expanded="false" class="hamburger">
    <span class="bar bar-top"></span>
    <span class="bar bar-mid"></span>
    <span class="bar bar-bot"></span>
  </button>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-heading">
    <h1>
      <span class="line-1 hero-anim hero-reveal" style="animation-delay: 0.25s;">Every layer</span>
      <span class="line-2 hero-anim hero-reveal" style="animation-delay: 0.42s;">tells a story.</span>
    </h1>
  </div>

  <div class="hero-description hero-anim hero-fade" style="animation-delay: 0.85s;">
    <p>EASYLOG transforms historical data into structured decisions — without losing the story behind it.</p>
  </div>

  <div class="hero-scroll hero-anim hero-fade" style="animation-delay: 1s;">
    <span class="scroll-circle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </span>
    <span class="scroll-text">Scroll down for more</span>
  </div>

  <div class="hero-year hero-anim hero-fade" style="animation-delay: 1s;">
    <span class="year-text">20-26</span>
  </div>
</section>

<script type="module" src="/src/main.js"></script>
</body>
</html>
